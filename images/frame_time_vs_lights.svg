<svg xmlns="http://www.w3.org/2000/svg" width="720" height="380" viewBox="0 0 720 380" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
  <rect width="720" height="380" fill="#ffffff"/>
  <text x="70" y="18" font-size="14" font-weight="600" fill="#222">Frame time vs. number of lights (median of 12 rounds, 2560x1271, cap 1024, log scale)</text>
  <rect x="420" y="26" width="12" height="12" rx="2" fill="#2a78d6"/><text x="437" y="36" fill="#444">Naive</text>
  <rect x="490" y="26" width="12" height="12" rx="2" fill="#eb6834"/><text x="507" y="36" fill="#444">Forward+</text>
  <rect x="580" y="26" width="12" height="12" rx="2" fill="#1baf7a"/><text x="597" y="36" fill="#444">Clustered Deferred</text>
  <g stroke="#e3e3e3" stroke-width="1">
    <line x1="70" y1="300.0" x2="700" y2="300.0"/>
    <line x1="70" y1="257.1" x2="700" y2="257.1"/>
    <line x1="70" y1="210.0" x2="700" y2="210.0"/>
    <line x1="70" y1="167.1" x2="700" y2="167.1"/>
    <line x1="70" y1="120.0" x2="700" y2="120.0"/>
    <line x1="70" y1="77.1" x2="700" y2="77.1"/>
    <line x1="70" y1="30.0" x2="700" y2="30.0"/>
  </g>
  <g fill="#666" text-anchor="end">
    <text x="62" y="304.0">1 ms</text>
    <text x="62" y="261.1">3 ms</text>
    <text x="62" y="214.0">10 ms</text>
    <text x="62" y="171.1">30 ms</text>
    <text x="62" y="124.0">100 ms</text>
    <text x="62" y="81.1">300 ms</text>
    <text x="62" y="34.0">1000 ms</text>
  </g>
  <!-- 500 lights -->
  <rect x="103" y="160.0" width="30" height="140.0" fill="#2a78d6"/>
  <rect x="135" y="230.3" width="30" height="69.7" fill="#eb6834"/>
  <rect x="167" y="254.5" width="30" height="45.5" fill="#1baf7a"/>
  <g font-size="10.5" fill="#333" text-anchor="middle">
    <text x="118" y="155.0">36.0</text>
    <text x="150" y="225.3">6.0</text>
    <text x="182" y="249.5">3.2</text>
  </g>
  <text x="150" y="322" text-anchor="middle" fill="#444">500</text>
  <!-- 1000 lights -->
  <rect x="253" y="133.4" width="30" height="166.6" fill="#2a78d6"/>
  <rect x="285" y="223.1" width="30" height="76.9" fill="#eb6834"/>
  <rect x="317" y="251.0" width="30" height="49.0" fill="#1baf7a"/>
  <g font-size="10.5" fill="#333" text-anchor="middle">
    <text x="268" y="128.4">71.0</text>
    <text x="300" y="218.1">7.2</text>
    <text x="332" y="246.0">3.5</text>
  </g>
  <text x="300" y="322" text-anchor="middle" fill="#444">1000</text>
  <!-- 2000 lights -->
  <rect x="403" y="106.6" width="30" height="193.4" fill="#2a78d6"/>
  <rect x="435" y="201.1" width="30" height="98.9" fill="#eb6834"/>
  <rect x="467" y="230.3" width="30" height="69.7" fill="#1baf7a"/>
  <g font-size="10.5" fill="#333" text-anchor="middle">
    <text x="418" y="101.6">141.1</text>
    <text x="450" y="196.1">12.6</text>
    <text x="482" y="225.3">6.0</text>
  </g>
  <text x="450" y="322" text-anchor="middle" fill="#444">2000</text>
  <!-- 5000 lights -->
  <rect x="553" y="70.8" width="30" height="229.2" fill="#2a78d6"/>
  <rect x="585" y="167.8" width="30" height="132.2" fill="#eb6834"/>
  <rect x="617" y="214.3" width="30" height="85.7" fill="#1baf7a"/>
  <g font-size="10.5" fill="#333" text-anchor="middle">
    <text x="568" y="65.8">351.8</text>
    <text x="600" y="162.8">29.5</text>
    <text x="632" y="209.3">9.0</text>
  </g>
  <text x="600" y="322" text-anchor="middle" fill="#444">5000</text>
  <line x1="70" y1="300" x2="700" y2="300" stroke="#999"/>
  <text x="385" y="345" text-anchor="middle" fill="#444">number of lights</text>
  <text x="385" y="368" text-anchor="middle" fill="#888" font-size="11">RTX 3090 Ti, Chrome 155, Sponza, default camera, Perlin-animated lights. Median of the 12 per-round medians in the four cap-1024 runs in results/ (mean of the middle two, rounded half up).</text>
</svg>
